<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0C10">
<title>Money Reels</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Money Reels">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: one dark visual world, like a reels app. Full-screen cards snap vertically.
   Amber is the brand accent; green/red are reserved for gains and losses. */
:root{
  --ink:#0A0C10;
  --panel:#151922;
  --text:#F4F2EC;
  --muted:#A7ADBA;
  --accent:#FFB547;
  --gain:#3DDC97;
  --loss:#FF5C6C;
  --line:rgba(255,255,255,.12);
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
a{color:inherit}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink)}

/* ---------- header ---------- */
.top{position:absolute;inset:0 0 auto 0;z-index:30;padding:calc(var(--safe-t) + 10px) 0 18px;
  background:linear-gradient(to bottom, rgba(10,12,16,.92), rgba(10,12,16,.55) 70%, transparent);pointer-events:none}
.top > *{pointer-events:auto}
.brandrow{display:flex;align-items:center;gap:10px;padding:0 16px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#1a1205;display:grid;place-items:center;font-family:var(--display);font-size:18px;line-height:1}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;line-height:1}
.issue{font-size:12px;color:var(--muted);margin-left:2px;font-family:var(--mono)}
.count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}

/* ---------- feed ---------- */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  display:flex;flex-direction:column;isolation:isolate;--hue:#3B82F6}
.reel .bg{position:absolute;inset:0;z-index:-2;background-color:var(--ink);
  background-image:
   radial-gradient(110% 70% at 85% 8%, color-mix(in oklab, var(--hue) 55%, transparent), transparent 62%),
   radial-gradient(90% 60% at 0% 100%, color-mix(in oklab, var(--hue) 30%, transparent), transparent 60%)}
.reel .ghost{position:absolute;z-index:-1;left:-6%;top:34%;font-family:var(--display);font-size:38vh;line-height:.8;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.06);white-space:nowrap;transform:rotate(-90deg) translateX(-30%);transform-origin:left top;pointer-events:none;user-select:none}
.spacer{flex:none;height:calc(var(--safe-t) + 104px)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:6px 76px 8px 18px}
.cap{flex:none;padding:14px 76px calc(var(--safe-b) + 20px) 18px;
  background:linear-gradient(to top, rgba(10,12,16,.95), rgba(10,12,16,.7) 70%, transparent)}

/* caption */
.who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#111;background:var(--hue);flex:none}
.handle{font-weight:700;font-size:14px}
.when{white-space:nowrap;font-size:12px;color:var(--muted);font-family:var(--mono)}
.tagpill{margin-left:auto;font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.headline{font-size:21px;line-height:1.18;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
.caption{margin-top:7px;font-size:14.5px;line-height:1.42;color:#D5D8DF;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morebtn{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(255,181,71,.14);border:1px solid rgba(255,181,71,.35);color:var(--accent);font-size:13px;font-weight:700}
.morebtn .coin{width:16px;height:16px;border-radius:50%;background:var(--accent);color:#1a1205;display:grid;place-items:center;font-size:11px;font-weight:800}

/* right rail */
.rail{position:absolute;right:10px;bottom:calc(var(--safe-b) + 28px);z-index:5;display:flex;flex-direction:column;gap:16px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#E8EAF0;width:56px}
.rbtn svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));transition:transform .15s}
.rbtn:active svg{transform:scale(.86)}
.rbtn[aria-pressed="true"].like svg{color:var(--loss)}
.rbtn[aria-pressed="true"].like svg path{fill:currentColor}
.rbtn[aria-pressed="true"].save svg{color:var(--accent)}
.rbtn[aria-pressed="true"].save svg path{fill:currentColor}

/* heart burst */
.burst{position:absolute;z-index:20;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;color:#fff;animation:burst .8s ease-out forwards}
.burst svg{width:100%;height:100%;filter:drop-shadow(0 6px 18px rgba(255,92,108,.55))}
.burst path{fill:var(--loss)}
@keyframes burst{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.15);opacity:1}30%{transform:scale(.95)}70%{opacity:1;transform:scale(1)}100%{transform:scale(1.25) translateY(-40px);opacity:0}}

/* ---------- visuals ---------- */
.vtitle{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.bignum{font-family:var(--display);font-size:clamp(76px, 25vw, 132px);line-height:.92;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.bignum.gain{color:var(--gain)} .bignum.loss{color:var(--loss)} .bignum.acc{color:var(--accent)}
.biglabel{margin-top:10px;font-size:15px;color:#D9DCE3;max-width:30ch;line-height:1.35}
.bars{display:grid;gap:10px;margin-top:22px}
.bar{display:grid;grid-template-columns:minmax(92px,1fr) 2fr auto;align-items:center;gap:10px;font-size:13px}
.bar .bl{color:#DADDE4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{display:block;height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .bf{display:block;height:100%;border-radius:5px;transform-origin:left;width:var(--w)}
.bar .bv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:62px;text-align:right}
.loss-c{color:var(--loss)} .gain-c{color:var(--gain)} .acc-c{color:var(--accent)}
.bf.loss{background:var(--loss)} .bf.gain{background:var(--gain)} .bf.acc{background:var(--accent)}

.board{border:1px solid var(--line);border-radius:16px;background:rgba(10,12,16,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden}
.brow{display:flex;align-items:baseline;gap:10px;padding:13px 14px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .k{font-size:14px;color:#D5D8DF;flex:1;min-width:0}
.brow .k small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.brow .v{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.brow .ch{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.vfoot{margin-top:12px;font-size:12.5px;color:var(--muted);font-family:var(--mono);line-height:1.5}

.vs{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:end;height:min(36vh,280px)}
.vcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:8px}
.vcol .vbar{border-radius:12px 12px 4px 4px;height:var(--h);transform-origin:bottom}
.vcol .vnum{font-family:var(--display);font-size:clamp(40px,12vw,64px);line-height:1}
.vcol .vlab{font-size:13px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}

.ticker{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px}
.ticker .sym{font-family:var(--display);font-size:clamp(70px,22vw,112px);line-height:.9;color:var(--accent)}
.ticker .ex{font-family:var(--mono);font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid rgba(255,181,71,.5);color:var(--accent);letter-spacing:.08em}

.timeline{position:relative;display:grid;gap:14px;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative}
.tl:before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--muted)}
.tl.now:before{border-color:var(--accent);background:var(--accent)}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.tl .t{font-size:15px;line-height:1.3;margin-top:2px}
.tl .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

.deals{display:grid;gap:10px}
.deal{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(10,12,16,.45);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.deal .who2{font-weight:700;font-size:15px}
.deal .who2 span{color:var(--muted);font-weight:500}
.deal .amt{font-family:var(--display);font-size:26px;line-height:1}
.deal .st{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.deal .st b{font-weight:600}
.deal .st .bad{color:var(--loss)} .deal .st .ok{color:var(--gain)} .deal .st .pend{color:var(--accent)}

/* entrance animation (content is visible at rest; .live replays it) */
.live .anim{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.live .anim:nth-child(2){animation-delay:.06s}.live .anim:nth-child(3){animation-delay:.12s}.live .anim:nth-child(4){animation-delay:.18s}.live .anim:nth-child(5){animation-delay:.24s}.live .anim:nth-child(6){animation-delay:.3s}
.live .bf{animation:grow .9s .15s cubic-bezier(.2,.8,.2,1) both}
.live .vbar{animation:growv .9s .1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growv{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- explainer reels ---------- */
.edu .stage{position:relative;padding-right:76px}
.segs{position:absolute;left:14px;right:14px;top:calc(var(--safe-t) + 100px);z-index:6;display:flex;gap:4px}
.seg{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:#fff}
.seg.done i{width:100%}
.scenes{position:relative;flex:1;min-height:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transition:opacity .35s, visibility .35s}
.scene.on{opacity:1;visibility:visible}
.scene .sk{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.scene .st2{font-family:var(--display);font-size:clamp(38px,11.5vw,60px);line-height:1.02;letter-spacing:.2px;text-wrap:balance}
.scene .ss{margin-top:14px;font-size:17px;line-height:1.42;color:#DADDE4;max-width:32ch}
.scene.on .st2{animation:kin .55s cubic-bezier(.2,.8,.2,1) both}
.scene.on .ss{animation:kin .55s .12s cubic-bezier(.2,.8,.2,1) both}
.scene.on .sv{animation:kin .55s .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes kin{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.flow{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.flow .fs{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.flow .fs b{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:18px}
.flow .arrow{padding-left:18px;color:var(--muted);font-size:13px;line-height:1}
.scene.on .flow .fs{animation:kin .45s both}
.scene.on .flow .fs:nth-of-type(2){animation-delay:.35s}.scene.on .flow .fs:nth-of-type(3){animation-delay:.7s}.scene.on .flow .fs:nth-of-type(4){animation-delay:1.05s}.scene.on .flow .fs:nth-of-type(5){animation-delay:1.4s}
.dca{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:150px;margin-top:18px}
.dca .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.dca .p{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(to top, color-mix(in oklab, var(--hue) 70%, #000), var(--hue));height:var(--h)}
.dca .lab{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dca .sh{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.split div{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(10,12,16,.45)}
.split small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.split strong{font-family:var(--display);font-size:38px;line-height:1.1}
.split .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
.ctrl{position:absolute;top:calc(var(--safe-t) + 114px);right:12px;z-index:7;display:flex;gap:8px}
.cbtn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(10,12,16,.6);border:1px solid var(--line);font-size:12px;font-weight:700}
.cbtn svg{width:16px;height:16px}
.cbtn[aria-pressed="true"]{background:var(--text);color:var(--ink)}
.pausemark{position:absolute;left:50%;top:48%;z-index:8;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(10,12,16,.55);display:none;place-items:center;pointer-events:none}
.pausemark svg{width:34px;height:34px}
.edu.paused .pausemark{display:grid}

/* swipe hint */
.hint{position:absolute;left:50%;bottom:calc(var(--safe-b) + 6px);transform:translateX(-50%);z-index:4;font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.hint.gone{display:none}

/* end card */
.endcard .stage{align-items:flex-start;padding-right:18px}
.endcard h2{font-family:var(--display);font-size:clamp(44px,13vw,72px);line-height:1}
.endcard p{margin-top:12px;color:#D5D8DF;font-size:16px;line-height:1.45;max-width:34ch}
.endcard .row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.pbtn{padding:12px 16px;border-radius:12px;background:var(--accent);color:#1a1205;font-weight:800;font-size:15px}
.gbtn{padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:15px}
.empty{color:var(--muted)}

.pts{display:grid;gap:10px}
.pt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(10,12,16,.45);font-size:15.5px;line-height:1.35}
.pt b{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:3px}
.newpill{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--gain);color:#06210f}
.divider .check{width:56px;height:56px;border-radius:50%;border:2px solid var(--gain);color:var(--gain);display:grid;place-items:center;font-size:28px;margin-bottom:16px}
.endcard .small{font-size:12.5px;color:var(--muted);margin-top:26px}
.fresh{position:absolute;left:50%;top:calc(var(--safe-t) + 108px);z-index:35;transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:9px 16px;border-radius:999px;background:var(--accent);color:#1a1205;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .25s, transform .25s}
.fresh.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:86%;display:flex;flex-direction:column;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sh-head{flex:none;padding:10px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.grab{position:absolute;left:50%;top:6px;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);transform:translateX(-50%)}
.sh-title{font-weight:800;font-size:15px;padding-top:8px}
.xbtn{margin-left:auto;margin-top:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
.xbtn svg{width:16px;height:16px}
.sh-body{overflow-y:auto;padding:16px 18px calc(var(--safe-b) + 28px);-webkit-overflow-scrolling:touch}
.sh-body h2{font-size:22px;line-height:1.2;font-weight:800;text-wrap:balance}
.sh-body .meta{margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sh-body p{margin-top:12px;font-size:15.5px;line-height:1.55;color:#DDE0E6}
.box{margin-top:18px;border-radius:14px;padding:14px 14px 14px 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:3px solid var(--accent)}
.box.risk{border-left-color:var(--loss)}
.box h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
.box.risk h3{color:var(--loss)}
.box ul{list-style:none;display:grid;gap:9px}
.box li{font-size:15px;line-height:1.45;padding-left:16px;position:relative;color:#E3E5EA}
.box li:before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.srcs{margin-top:18px}
.srcs h3{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.srcs a{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:#CFE0FF}
.srcs a span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.disc{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.5}

: "Gold closed Friday at $4,074 an ounce, down about 1%. UBS sees limited downside, saying three sources of demand put a floor near $4,000.", "visual": {"type": "stat", "title": "Gold, Friday close", "num": "$4,074", "tone": "acc", "label": "Per ounce, down 0.96% on the day.", "facts": [["UBS view", "~$4,000 floor", "Three demand pillars"], ["Late October", "Tumbled", "Per E*Trade weekly recap"]]}, "detail": ["Gold slipped Friday as Treasury yields and the dollar rose after the strong jobs report. It closed at $4,074 an ounce.", "UBS said three pillars of demand should keep a floor under prices near $4,000. Gold had tumbled in the last week of October while small and mid-cap stocks rallied.", "Higher interest rates tend to weigh on gold because it pays no yield."], "money": ["At $4,000+ an ounce, old gold jewelry and coins from estate sales or auctions can be worth far more than their price tags; know the melt value before you bid.", "Many investors keep a small slice, often 5–10%, in gold as a hedge.", "Gold ETFs avoid storage and dealer markups compared with physical bars."], "risk": ["A December rate hike could pressure gold prices."], "sources": [{"t": "Nightly market digest, Nov 6, 2026", "d": "stockmarketwatch.com", "u": "https://stockmarketwatch.com/digest/2026-11-06"}, {"t": "Earnings next week (with UBS gold headline)", "d": "investinglive.com", "u": "https://investinglive.com/stocks/earnings-next-week-can-apple-palantir-and-amd-restore-confidence/"}, {"t": "AI retreat stymies bulls (Nov 2 recap)", "d": "us.etrade.com", "u": "https://us.etrade.com/knowledge/library/perspectives/daily-insights/nov2-market-recap"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "bigtech-earn", "type": "news", "cat": "markets", "tags": ["markets", "ai"], "date": "Late Oct", "headline": "Earnings beats are not enough: Alphabet, Amazon and Intel all sold off", "caption": "Alphabet slid more than 9% after hours on a search miss and $9 billion in cash burn, overshadowing its cloud growth. Intel and Amazon also dropped sharply after reporting.", "visual": {"type": "points", "title": "Big Tech earnings lesson", "items": ["Alphabet: −9% after hours on a search miss and $9B cash burn", "Intel and Amazon: sharp drops after their reports", "Investors now judge guidance, margins and AI spending", "Apple, Palantir and AMD reported the following week"]}, "detail": ["Late-October earnings showed how fast buyers turn into sellers. Alphabet fell more than 9% after hours as weaker search results and heavy spending outweighed cloud gains.", "Intel and Amazon also sold off after their reports, even where headline earnings beat estimates.", "The common thread: investors want proof that massive AI spending turns into profit and cash flow."], "money": ["Owning a stock through earnings is a coin flip on reaction, not results. Size positions accordingly.", "Read the guidance, not the headline beat; that is what moves the stock.", "Post-earnings drops in great companies can be buying chances for long-term investors who did their homework."], "risk": ["A big drop can keep going if guidance cuts follow."], "sources": [{"t": "Earnings next week: can Apple, Palantir and AMD restore confidence?", "d": "investinglive.com", "u": "https://investinglive.com/stocks/earnings-next-week-can-apple-palantir-and-amd-restore-confidence/"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "ichra", "type": "news", "cat": "business", "tags": ["business", "benefits"], "date": "2026 trend", "headline": "Employers are switching how they pay for health insurance", "caption": "Adoption of ICHRAs, where a company gives workers a set amount to buy their own plan, jumped 53% in 2026 as group insurance costs climbed.", "visual": {"type": "stat", "title": "Small business benefits", "num": "+53%", "tone": "acc", "label": "Growth in ICHRA adoption in 2026.", "facts": [["How it works", "Fixed allowance", "Workers pick an ACA plan"], ["Marketplace sign-ups", "23.1M", "For 2026, down from 24.2M"]]}, "detail": ["An individual coverage HRA lets an employer reimburse workers tax-free for individual health plans instead of running a group plan. Large and small employers adopted them 53% more in 2026.", "Employers like the fixed cost; workers can keep the plan if they change jobs.", "It overlaps with self-employed and small-business buyers, who are also feeling rising marketplace premiums."], "money": ["Small business owners: an ICHRA can cap health benefit costs while still offering coverage.", "Employees offered an ICHRA can shop marketplace plans with the allowance, tax-free.", "Compare: if the allowance makes coverage \"affordable,\" you may lose ACA subsidy eligibility."], "risk": ["Plan choice and costs depend heavily on your local marketplace."], "sources": [{"t": "ACA premiums are rising again in 2027: the broker conversation", "d": "insurancebusinessmag.com", "u": "https://www.insurancebusinessmag.com/us/news/benefits/aca-premiums-are-rising-again-in-2027--heres-the-broker-conversation-587988.aspx"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "openai-cursor", "type": "news", "cat": "ai", "tags": ["ai", "business"], "date": "Nov 12 & Nov 20", "headline": "OpenAI cuts Cursor off on Nov 12 after SpaceX buys the coding app", "caption": "OpenAI will stop supplying its models to Cursor on November 12. From November 20, new OpenAI rules require approval for model routers and AI gateways.", "visual": {"type": "timeline", "title": "AI platform shakeup", "items": [{"d": "NOV 12", "t": "Cursor loses access to OpenAI models", "s": "After SpaceX acquired the coding tool", "now": true}, {"d": "NOV 20", "t": "OpenAI usage policy update", "s": "Routers and AI gateways need approval; direct-access services treated separately"}]}, "detail": ["OpenAI said it will stop supplying models to Cursor, the AI coding editor, on November 12, 2026, after SpaceX bought the tool.", "Separately, OpenAI’s updated usage policies take effect November 20. They distinguish services that resell direct model access from apps that use OpenAI models inside their own features, and require approval for model routers and gateways.", "The moves show AI labs tightening control over who can resell their models."], "money": ["If your business or side project runs on one AI vendor, build in a backup; access can change with weeks of notice.", "Coding tools that support several model providers protect you from these cutoffs.", "Platform fights create openings for tools and freelancers who help companies switch."], "risk": ["Details of enforcement are still emerging."], "sources": [{"t": "OpenAI releases & news", "d": "ai-tldr.dev", "u": "https://ai-tldr.dev/releases/org/openai/"}, {"t": "OpenAI usage policy changes from November 20 (related news)", "d": "opentools.ai", "u": "https://opentools.ai/news/openai-frontier-training-offline-containment-pause-october-restart"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "medicare-dates", "type": "news", "cat": "benefits", "tags": ["benefits"], "date": "Through Dec 7", "headline": "Medicare open enrollment ends Dec 7, and your 2027 benefit notice is coming", "caption": "People on Medicare can switch plans until December 7. If you are on Social Security, your new 2027 amount shows up online in late November.", "visual": {"type": "timeline", "title": "Benefit deadlines", "items": [{"d": "OCT 15", "t": "Medicare open enrollment opened"}, {"d": "NOV 18", "t": "Go paperless to see your COLA notice online", "s": "my Social Security account", "now": true}, {"d": "LATE NOV", "t": "2027 benefit amounts posted", "s": "For Medicare enrollees, in the Message Center"}, {"d": "DEC 7", "t": "Medicare open enrollment ends"}, {"d": "DECEMBER", "t": "Paper COLA notices mailed"}]}, "detail": ["Medicare’s annual open enrollment lets people change Medicare Advantage or drug plans each fall, ending December 7.", "The Social Security Administration says people enrolled in Medicare can see their 2027 benefit amount in their my Social Security Message Center starting in late November. Details on Medicare changes for 2027 are published on Medicare.gov.", "To view the COLA notice online rather than wait for mail, sign up for paperless notices by November 18."], "money": ["Compare drug plans every year: a plan change can save hundreds if your prescriptions changed.", "Help an older parent check their plan before December 7.", "Watch your net check: Medicare premiums come out of Social Security payments."], "risk": ["Plan changes after Dec 7 are limited to special circumstances."], "sources": [{"t": "Medicare.gov", "d": "medicare.gov", "u": "https://www.medicare.gov/"}, {"t": "Social Security announces 3.6% COLA (Medicare details)", "d": "housingwire.com", "u": "https://www.housingwire.com/articles/social-security-announces-3-6-cola-increase-for-2027/"}, {"t": "2027 COLA: what it means and when", "d": "nbcchicago.com", "u": "https://www.nbcchicago.com/news/local/2027-social-security-cola-increase-heres-what-it-means-for-checks-and-when/4002339/"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "edu-cola", "type": "edu", "cat": "learn", "tags": ["learn", "benefits"], "date": "Explainer", "headline": "How Social Security decides your raise", "caption": "The exact math behind the 3.6% COLA, in six scenes.", "scenes": [{"k": "Benefits 101", "t": "Your Social Security raise is not random.", "s": "It is set by a formula in the law."}, {"k": "The index", "t": "It tracks CPI-W.", "s": "An inflation index based on what wage earners and clerical workers buy."}, {"k": "The math", "t": "This summer vs last summer.", "viz": {"type": "split", "items": [["Jul–Sep 2025 avg", "317.265"], ["Jul–Sep 2026 avg", "328.746"], ["Increase, rounded", "3.6%", "wide"]]}, "say": "The average index from July to September this year, compared with last year, rose three point six percent."}, {"k": "When it hits", "t": "January checks. SSI on Dec 31.", "s": "The raise applies to December benefits, paid in January."}, {"k": "History", "t": "Since 2020, COLAs averaged 3.7%.", "s": : "kff.org", "u": "https://kff.org/affordable-care-act/9-things-to-watch-for-the-2027-aca-open-enrollment-period/"}, {"t": "Free fruits and vegetables through CalFresh available again", "d": "ktvu.com", "u": "https://www.ktvu.com/news/free-fruits-vegetables-through-calfresh-available-again"}, {"t": "New York POWER rebate payments through December", "d": "fingerlakes1.com", "u": "https://www.fingerlakes1.com/2026/11/06/still-waiting-for-a-check-new-yorks-power-rebate-payments-continuing-through-december/"}], "ts": "2026-11-09T07:11:26Z"}, {"id": "crash", "type": "news", "cat": "markets", "tags": ["markets", "ai"], "date": "Thu Nov 5", "headline": "Nasdaq 100 has its worst day since 2020 as chip stocks get crushed", "caption": "Two days after Democrats won Congress, investors dumped AI and chip stocks on fears of tighter rules for data centers. About $3 trillion in value vanished in one session.", "visual": {"type": "stat", "title": "Thursday, Nov 5 close", "num": "−6.36%", "tone": "loss", "label": "Nasdaq 100. The S&P 500 fell 4.35% and the Dow lost 1,833 points.", "rows": [["SanDisk", -22.26], ["Micron", -17.46], ["Western Digital", -17.35], ["S&P 500", -4.35]]}, "detail": ["The selloff hit memory and storage makers hardest, then spread to chip equipment and data-center suppliers. The Philadelphia Semiconductor Index fell about 12%, its biggest one-day drop since 2020, and every one of the 30 Dow stocks closed lower.", "The trigger was political. Democrats won control of both chambers, including in states where data-center growth has been contentious, and investors priced in slower AI buildouts and more regulation. Senators Sanders and Ocasio-Cortez are pushing a bill for a data-center moratorium.", "Perspective matters: SanDisk was still up more than 200% for 2026 after the drop, and Micron about 130%. The Nasdaq Composite is now officially in a correction, down 10% from its October 6 record."], "money": ["Corrections are when long-term buyers get better prices. If you already invest, keep your scheduled buys running instead of stopping.", "Broad index funds spread the risk. A single chip stock can drop 20% in a day; an S&P 500 fund fell 4.35%.", "Write down a watchlist and target prices now, while you are calm, instead of deciding mid-panic."], "risk": ["Regulation fears may not be priced in yet; dips can keep dipping.", "Never use margin or borrowed money to \"buy the dip.\""], "sources": [{"t": "Nasdaq 100 suffers worst day since 2020", "d": "investinglive.com", "u": "https://investinglive.com/stocks/nasdaq-100-suffers-worst-day-since-2020/"}, {"t": "Nasdaq falls 5.5% two days after Democrats’ sweep", "d": "northeasttimes.com", "u": "https://northeasttimes.com/?p=166108"}, {"t": "Nasdaq posts biggest daily drop in 19 months (Reuters)", "d": "thenightly.com.au", "u": "https://thenightly.com.au/business/wall-street-opens-lower-as-shares-of-tech-firms-slump-c-23123264"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-dca", "type": "edu", "cat": "learn", "tags": ["learn"], "date": "Explainer", "headline": "Crash week? How regular people turn drops into discounts", "caption": "Dollar-cost averaging, explained with real math in under a minute.", "scenes": [{"k": "Money moves · 60 sec", "t": "Stocks just had their worst day since 2020.", "s": "Here is how regular investors turn crashes into discounts."}, {"k": "The strategy", "t": "Dollar-cost averaging", "s": "Invest the same dollar amount on a schedule. Every week, no matter what the market does."}, {"k": "$100 a week", "t": "Cheap weeks buy more shares.", "s": "Same $100, different prices:", "viz": {"type": "dca", "cols": [[50, "2"], [40, "2.5"], [25, "4"], [50, "2"]]}, "say": "Same hundred dollars each week. At fifty dollars you get two shares. At twenty-five, you get four."}, {"k": "The result", "t": "10.5 shares for $400", "s": "Your average cost is $38.10, while the average price was $41.25. The dip did the work.", "viz": {"type": "split", "items": [["Avg price", "$41.25"], ["Your avg cost", "$38.10"]]}, "say": "Ten and a half shares for four hundred dollars. Your average cost is thirty-eight ten, below the average price of forty-one twenty-five."}, {"k": "The catch", "t": "Only on things that recover.", "s": "Use broad index funds, not one hype stock. And never borrowed money."}, {"k": "Do this", "t": "Set it. Automate it.", "s": "Most brokerages let you schedule recurring buys for free."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "midterms", "type": "news", "cat": "politics", "tags": ["politics"], "date": "Tue Nov 3", "headline": "Democrats take both the House and Senate in a midterm landslide", "caption": "Seven Senate seats flipped, including Texas, where James Talarico beat Ken Paxton. Republicans lose their trifecta; divided government starts in January.", "visual": {"type": "board", "title": "Congress from Jan 3, 2027", "rows": [{"k": "Senate", "s": "Two races still being counted", "v": "D 54 · R 44"}, {"k": "House", "s": "Early count, races still open", "v": "D 231 · R 141"}, {"k": "Ballots cast", "s": "Beats the 2018 record of ~119M", "v": "124M+"}, {"k": "Texas Senate", "s": "First Democratic win there since 1988", "v": "Talarico (D)"}]}, "detail": ["Democrats needed to flip four Senate seats and gained seven, including a seat in South Carolina, where the party had not won a Senate race since 1998. In the House, Democrats were on pace for their largest majority since 2008.", "Hakeem Jeffries is on track to become the first Black House speaker; he needs 218 votes when the new Congress convenes on January 3. Democratic leadership elections are the week of November 16.", "President Trump congratulated Democrats while distancing himself from the losses. With a Republican president and a Democratic Congress, expect more investigations and fewer big new laws through 2028."], "money": ["Gridlock usually means fewer surprise tax or spending changes, which markets tend to like over time.", "Sectors Congress targets with hearings move first. This week that was AI data centers and chipmakers.", "Big new federal programs are unlikely before 2028, so plan around current tax rules, not campaign promises."], "risk": ["Two Senate races and many House seats were still being counted when this was written."], "sources": [{"t": "Election 2026: Democrats capture both chambers of Congress", "d": "wsbtv.com (AP)", "u": "https://www.wsbtv.com/news/trending/election-2026-democrats-capture-both-houses-congress/5ILOWTVABVDPZFYP7VBBCX4EWE/"}, {"t": "Has America seen a midterm upset like this before?", "d": "americanbazaaronline.com", "u": "https://americanbazaaronline.com/2026/11/04/has-america-seen-a-midterm-upset-like-this-before-491503/"}, {"t": "Midterm election results: three things to know", "d": "live5news.com", "u": "https://www.live5news.com/2026/11/04/midterm-election-results-three-things-know/"}, {"t": "Democrats capture full control of Congress", "d": "nbcdfw.com", "u": "https://www.nbcdfw.com/elections/democrats-control-of-congress/"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-gridlock", "type": "edu", "cat": "learn", "tags": ["learn", "politics"], "date": "Explainer", "headline": "Why Wall Street can like a split government", "caption": "Gridlock, sector risk, and where to watch for the next move.", "scenes": [{"k": "Politics → money", "t": "Democrats run Congress. Trump runs the White House.", "s": "That is called divided government."}, {"k": "Translation", "t": "Gridlock.", "s": "Big new laws need both sides to agree, so there are fewer surprise policy swings."}, {"k": "Why investors care", "t": "Less surprise, less risk.", "s": "Markets usually prefer predictable over exciting."}, {"k": "But", "t": "Sectors still get hit.", "s": "This week chip and AI stocks plunged on fears of tighter rules for data centers."}, {"k": "Your edge", "t": "Follow the hearings.", "s": "The industries Congress puts under the microscope are where volatility shows up first."}, {"k": "Remember", "t": "Headlines move prices. Plans make money.", "s": "Decide your rules before the next scary day."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "jobs", "type": "news", "cat": "markets", "tags": ["markets"], "date": "Fri Nov 6", "headline": "Hot jobs report: 165,000 hires, and a December rate hike now looks likely", "caption": "Employers added nearly triple what economists expected. Unemployment slipped to 4.1%. Futures traders now put the odds of a Fed hike on Dec 9 at about 77%.", "visual": {"type": "vs", "title": "October payrolls", "a": ["Expected", "65K", 0.39, "acc"], "b": ["Actual", "165K", 1, "gain"], "foot": "Unemployment 4.1% (from 4.2%) · Prior two months revised up 84K · Fed funds 3.75–4.00%"}, "detail": ["October payrolls came in at 165,000 against forecasts of about 65,000. September was revised to 60,000, and the prior two months together were revised up by 84,000.", "Good news for workers became a worry for markets: a strong labor market gives the Fed room to raise rates again to keep inflation down. CME FedWatch priced a 76.8% chance of a quarter-point hike at the December 8–9 meeting.", "The last jobs report before that decision lands December 4."], "money": ["Savers win when rates rise. High-yield savings accounts, CDs and Treasury bills pay more; compare rates now.", "If you are buying a car or home soon, rate hikes push loan costs up. Locking a rate earlier can save money.", "Pay down variable-rate debt like credit cards first; those rates climb with every Fed hike."], "risk": ["One strong report can be revised later. The Dec 4 report could change the odds again."], "sources": [{"t": "October jobs report beats forecasts, lifting December Fed hike odds", "d": "investmentnews.com", "u": "https://www.investmentnews.com/fixed-income/october-jobs-report-beats-forecasts-lifting-december-fed-hike-odds/268915"}, {"t": "Stock market recap, November 6, 2026", "d": "alainguillot.com", "u": "https://www.alainguillot.com/stock-market-recap-november-6-2026/"}, {"t": "Stock market week ahead (Nov 2–6)", "d": "regardsofwallstreet.com", "u": "https://www.regardsofwallstreet.com/news/stock-market-week-ahead-november-2-2026"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-fed", "type": "edu", "cat": "learn", "tags": ["learn", "markets"], "date": "Explainer", "headline": "Why good jobs news made traders nervous", "caption": "The chain from a hiring report to your stock portfolio and your savings account.", "scenes": [{"k": "The puzzle", "t": "165,000 jobs. Way above the 65,000 expected.", "s": "So why did it spook the market?"}, {"k": "The chain reaction", "t": "Follow the dominoes.", "viz": {"type": "flow", "items": ["Strong hiring", "Inflation risk", "Fed raises rates", "Borrowing costs up", "Stock values down"]}, "say": "Strong hiring raises inflation risk. The Fed raises rates. Borrowing costs go up, and stock values come down."}, {"k": "The odds", "t": "~77% chance of a December hike.", "s": "That is what futures traders priced right after the report."}, {"k": "Who gets hurt", "t": "Growth stocks feel it most.", "s": "Their profits are far in the future, and future dollars are worth less when rates rise."}, {"k": "Who wins", "t": "Savers.", "s": "High-yield savings, CDs and Treasury bills all pay more when the Fed hikes."}, {"k": "Mark your calendar", "t": "Dec 4 jobs. Dec 9 Fed.", "s": "Those two dates decide the next move."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "anthropic", "type": "news", "cat": "markets", "tags": ["markets", "ai"], "date": "This week", "headline": "Anthropic’s IPO could launch as soon as Tuesday, possibly the biggest ever", "caption": "The Claude maker plans to list on Nasdaq as ANT. Reports say it could raise $100 billion or more at a $1.5 to $2 trillion valuation, with pricing the week of Nov 16.", "visual": {"type": "ticker", "sym": "ANT", "ex": "NASDAQ", "rows": [{"k": "Roadshow launch", "s": "Per Renaissance Capital", "v": "As early as Tue"}, {"k": "Expected pricing", "v": "Week of Nov 16"}, {"k": "Raise", "s": "Reported by WSJ, not in filing", "v": "$100B+"}, {"k": "Valuation", "s": "Reported range", "v": "$1.5T–$2T"}, {"k": "Last private round", "s": "May 2026", "v": "$965B"}]}, "detail": ["Anthropic made its S-1 public on October 26, with Goldman Sachs and Morgan Stanley leading the underwriters. The filing left the share count and price range blank, so the size and valuation above are reported expectations, not confirmed numbers.", "The filing showed first-half 2026 revenue of about $16.3 billion. Reuters reported some investors valued the company near $1.5 trillion, down from roughly $2 trillion a week earlier.", "For scale: SpaceX priced a $75 billion IPO in June at a $1.75 trillion valuation, the record so far. This week’s AI selloff is the backdrop the deal launches into."], "money": ["Check now whether your brokerage offers IPO access and what it requires; allocations go to people who request early.", "You can also own a slice indirectly: Amazon and Alphabet are both Anthropic investors.", "Set a maximum price before day one. Hot IPOs often open far above the offer price, and chasing the first-day spike is how people overpay."], "risk": ["Mega-IPOs can trade below their offer price within months.", "Lock-up expirations, usually around 6 months later, can push the price down."], "sources": [{"t": "US IPO Week Ahead: vVardis and Rezera on deck as Anthropic launch looms", "d": "renaissancecapital.com", "u": "https://www.renaissancecapital.com/IPO-Center/News/122632/us-ipo-week-ahead-dental-tech-vvardis-and-biotech-rezera-on-deck-as"}, {"t": "Anthropic publicly files for IPO: what will ANT be worth?", "d": "benzinga.com", "u": "https://www.benzinga.com/node/62595495"}, {"t": "Anthropic makes IPO filing public, plans Nasdaq listing under ANT", "d": "decrypt.co", "u": "https://decrypt.co/381818/anthropic-makes-ipo-filing-public-plans-nasdaq-listing-under-ant"}, {"t": "Anthropic S-1 IPO filing explained", "d": "tech-insider.org", "u": "https://tech-insider.org/ie/anthropic-s1-ipo-filing-nasdaq-ant-2026/"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-ipo", "type": "edu", "cat": "learn", "tags": ["learn", "markets"], "date": "Explainer", "headline": "How an IPO actually works, and how you get in", "caption": "From the bank’s price range to the lock-up, in six steps.", "scenes": [{"k": "IPO 101", "t": "Anthropic could be the biggest IPO ever.", "s": "Ticker: ANT. Here is how IPOs actually work."}, {"k": "Step 1", "t": "The company sells new shares.", "s": "Banks like Goldman Sachs and Morgan Stanley set a price range and line up buyers."}, {"k": "Step 2", "t": "Big funds get most of them.", "s": "Regular investors get a small slice through apps that offer IPO access."}, {"k": "Step 3", "t": "Day one.", "s": "Anyone can buy once it trades, but hot IPOs often open far above the offer price."}, {"k": "Step 4", "t": "Watch the lock-up.", "s": "Insiders usually cannot sell for about six months. When that ends, extra supply can push the price down."}, {"k": "The play", "t": "Request early. Set a max. Don’t chase.", "s": "Decide your price before the hype, not during it."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "oil", "type": "news", "cat": "world", "tags": ["world", "markets"], "date": "Fri Nov 6", "headline": "Oil plunges about 15% this week on hopes of a US–Iran peace deal", "caption": "Qatar-mediated talks and the midterm results raised hopes the war that began Feb 28 could end. Attacks around the Strait of Hormuz have not fully stopped.", "visual": {"type": "stat", "title": "Oil this week", "num": "−15%", "tone": "gain", "label": "Lower oil is good for drivers and airlines, bad for energy stocks.", "facts": [["Brent, Nov 3 settle", "$103.60", "Lowest since Oct 7"], ["WTI, Fri close", "$90.43", ""], ["War began", "Feb 28, 2026", "US & Israel vs. Iran"]]}, "detail": ["Prices fell more than 7% on November 2 alone as Iranian and Qatari officials held days of talks on ending the war between Iran and the United States and Israel. President Trump said a deal \"could happen.\"", "Brent had finished October at a six-month high on fears fighting would escalate after the midterms. Talks over a Russia–Ukraine settlement added to the downward pressure.", "No agreement has been signed. The drop reflects expectations, not a return to normal shipping, and Goldman Sachs has warned prices can snap back if talks fail."], "money": ["Gas prices tend to follow crude with a lag, so fill-up costs could ease over the next few weeks.", "Airlines, trucking and delivery companies benefit from cheaper fuel; energy producers lose.", "If you are hedging against war risk, this is a reminder that peace headlines can erase gains in days."], "risk": ["A collapse in talks or a new attack on tankers could send oil back up fast."], "sources": [{"t": "The Iran war isn’t over, but oil traders are pricing in peace", "d": "oilprice.com", "u": "https://oilprice.com/Energy/Energy-General/The-Iran-War-Isnt-Over-but-Oil-Traders-Are-Already-Pricing-In-Peace.html"}, {"t": "Brent falls 1% on November 3 amid hopes for peace deals", "d": "nationthailand.com", "u": "https://www.nationthailand.com/news/world/40073076"}, {"t": "Oil falls as Iran–Qatar talks raise hopes of ending US–Iran war", "d": "political.org", "u": "https://political.org/2026/11/02/oil-falls-nearly-4-as-iran-qatar-talks-raise-hopes-of-progress-toward-ending-us-iran-war/"}, {"t": "Nightly market digest, Nov 6", "d": "stockmarketwatch.com", "u": "https://stockmarketwatch.com/digest/2026-11-06"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "tariffs", "type": "news", "cat": "politics", "tags": ["politics", "world"], "date": "This week", "headline": "Tariff check: the China truce now runs to Jan 10, and a new levy hits Nov 10", "caption": "The US–China truce was pushed back two months. A 25% tariff on Chinese cargo-handling equipment is scheduled for Tuesday, and Canada’s 50% tariff on $20B of goods is in force.", "visual": {"type": "timeline", "title": "Tariff timeline", "items": [{"d": "FEB 20, 2026", "t": "Supreme Court voids emergency tariffs", "s": "Government ordered to refund about $166 billion"}, {"d": "AUG 22, 2026", "t": "Canada: 50% on $20B of exports"}, {"d": "NOV 10, 2026", "t": "25% on Chinese cargo-handling equipment", "s": "Scheduled", "now": true}, {"d": "JAN 10, 2027", "t": "US–China truce expires", "s": "Extended from Nov 10 during Xi’s September visit"}]}, "detail": ["The November 2025 deal with China cut reciprocal tariffs to a flat 10% through November 10, 2026. During Xi Jinping’s September visit to Washington, both sides agreed to extend that truce to January 10, 2027.", "Separately, a 25% tariff on Chinese-origin maritime and cargo-handling equipment is scheduled to start November 10. Average US tariffs have risen from about 2% to 10% in two years, and the goods trade deficit hit a record.", "Tariff revenue fell for the first time since February, according to recent data, partly because of the court-ordered refunds."], "money": ["Resellers and small importers: if you sell China-made goods, buying inventory before Jan 10 locks in today’s 10% rate in case talks fail.", "If your business paid the voided emergency tariffs, check with your customs broker about refund claims.", "Expect price swings on imported electronics, tools and home goods around each deadline; that is where flip margins open and close."], "risk": ["Deadlines have been moved many times; plans built on one date can break."], "sources": [{"t": "US tariffs rise from 2% to 10% in two years", "d": "maaal.com", "u": "https://maaal.com/en/news/details/us-tariffs-rise-from-2-t/"}, {"t": "The TecEx Tariff Tracker", "d": "tecex.com", "u": "https://tecex.com/tariff-tracker/"}, {"t": "Trump 2.0 tariff tracker (updated Nov 3)", "d": "tradecomplianceresourcehub.com", "u": "https://www.tradecomplianceresourcehub.com/2026/11/03/trump-2-0-tariff-tracker/"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-tariff", "type": "edu", "cat": "learn", "tags": ["learn", "politics"], "date": "Explainer", "headline": "Who actually pays a tariff?", "caption": "Follow a tariff from the port to your receipt, and the reseller playbook around deadlines.", "scenes": [{"k": "Tariffs 101", "t": "A tariff is a tax on imports.", "s": "The importer pays it at the US border, not the foreign country."}, {"k": "Where it goes", "t": "The cost rolls downhill.", "viz": {"type": "flow", "items": ["Importer pays duty", "Wholesale price up", "Store price up", "You pay more"]}, "say": "The importer pays the duty. The wholesale price goes up, then the store price, and finally you pay more."}, {"k": "Plot twist", "t": "$166 billion in refunds.", "s": "After the Supreme Court struck down the emergency tariffs in February, importers got paid back."}, {"k": "Next deadline", "t": "January 10, 2027.", "s": "That is when the US–China truce now expires."}, {"k": "Reseller playbook", "t": "Buy before the deadline.", "s": "Stock up on China-made goods you flip, and track which items are exempt."}, {"k": "Remember", "t": "Tariffs move prices before headlines catch up.", "s": "Watch the dates, not the speeches."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "mna", "type": "news", "cat": "markets", "tags": ["markets"], "date": "Nov 2–6", "headline": "Deal week: Marvell agrees to buy Lumentum in a $115B all-stock deal", "caption": "Plus Shield buying Echodyne for $5.3B and a $1.6B bid for Helen of Troy. China blocked SoftBank’s $5.4B purchase of ABB’s robotics unit.", "visual": {"type": "deals", "title": "Biggest deals this week", "items": [{"a": "Marvell", "b": "Lumentum", "amt": "$115B", "st": "All-stock · announced Nov 2", "c": "pend"}, {"a": "Shield", "b": "Echodyne", "amt": "$5.3B", "st": "Blackstone financing · Nov 6", "c": "pend"}, {"a": "Empower Brands", "b": "Helen of Troy", "amt": "$1.6B", "st": "Proposal · Nov 5", "c": "pend"}, {"a": "SoftBank", "b": "ABB Robotics", "amt": "$5.4B", "st": "Blocked by China", "c": "bad"}]}, "detail": ["Marvell’s purchase of optical-component maker Lumentum is an all-stock deal valued around $115 billion, a bet on the AI networking gear inside data centers. Defense-tech firm Shield agreed to buy radar maker Echodyne for $5.3 billion.", "Oaktree-backed Empower Brands proposed buying consumer-products company Helen of Troy for $1.6 billion, and SpaceX is reportedly exploring a purchase of EchoStar’s Boost Mobile.", "Regulators remain the wild card: China blocked SoftBank’s $5.4 billion ABB robotics deal, according to the FT. In the US, comments on the $85 billion Union Pacific–Norfolk Southern merger are due November 18."], "money": ["Merger arbitrage: a target’s stock usually trades a bit below the deal price. That gap is what traders earn if the deal closes.", "In all-stock deals like Marvell–Lumentum, the payout moves with the buyer’s share price, so the target falls when the buyer falls.", "Blocked deals show the downside: the target can drop back to where it was before the announcement."], "risk": ["Spreads are small for a reason. A failed deal can wipe out years of small gains."], "sources": [{"t": "Deal news roundup, Nov 2–6, 2026", "d": "themiddlemarket.com", "u": "https://www.themiddlemarket.com/?p=99518"}, {"t": "China blocks SoftBank’s ABB robotics deal (FT), via Nasdaq recap", "d": "investinglive.com", "u": "https://investinglive.com/stocks/nasdaq-100-suffers-worst-day-since-2020/"}, {"t": "Upcoming M&A deals: pending mergers", "d": "dealroom.net", "u": "https://dealroom.net/blog/upcoming-m-a"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "edu-arb", "type": "edu", "cat": "learn", "tags": ["learn", "markets"], "date": "Explainer", "headline": "Merger arbitrage in 60 seconds", "caption": "Why a stock being bought for $100 trades at $95, and who earns the gap.", "scenes": [{"k": "Deal math", "t": "A company announces it is being bought.", "s": "The stock jumps, but usually not all the way to the deal price."}, {"k": "The spread", "t": "That gap is the spread.", "viz": {"type": "split", "items": [["Offer price", "$100"], ["Stock trades at", "$95"], ["Spread if deal closes", "+$5", "wide"]]}, "say": "If the offer is one hundred dollars and the stock trades at ninety-five, the spread is five dollars."}, {"k": "Why the gap?", "t": "Deals can die.", "s": "Regulators, financing or a shareholder vote can kill it."}, {"k": "Real example", "t": "China just blocked SoftBank’s $5.4B ABB deal.", "s": "That is the risk arbitrage traders get paid to take."}, {"k": "All-stock twist", "t": "Paid in shares, not cash.", "s": "Like Marvell and Lumentum: the payout moves with the buyer’s stock price."}, {"k": "The rule", "t": "Small positions. Many deals.", "s": "Never bet big on one merger closing."}], "ts": "2026-11-09T06:55:00Z"}, {"id": "crypto", "type": "news", "cat": "crypto", "tags": ["crypto"], "date": "Week of Oct 26–30", "headline": "Bitcoin slides under $78K as risk appetite fades", "caption": "Bitcoin fell 4.8% in the last week of October, ether 6% and solana 6.4%. After the midterms, traders are watching $82,000 as the level that flips the trend.", "visual": {"type": "board", "title": "Crypto, week ending Oct 30", "rows": [{"k": "Bitcoin", "v": "$77,198", "ch": -4.8}, {"k": "Ether", "v": "$2,241", "ch": -6}, {"k": "Solana", "v": "$96.22", "ch": -6.4}, {"k": "BTC all-time high", "s": "Oct 6, 2025", "v": "$126,198"}], "foot": "Bitcoin sits roughly 40% below its record."}, "detail": ["Crypto followed tech stocks lower as investors pulled back from speculative assets. Bitcoin closed the week at about $77,198, ether near $2,241 and solana around $96.", "A December rate hike would be a headwind: higher rates make holding assets with no yield less attractive.", "After the election, crypto analysts flagged $82,000 as the key resistance level. Bitcoin’s record is $126,198, set in October 2025."], "money": ["If you buy crypto, small recurring buys reduce the risk of going all-in at a bad price.", "Keep crypto a small slice of what you invest; a 40% drawdown from the high is normal for bitcoin.", "Track your cost basis now. Crypto sales are taxable, and losses can offset gains."], "risk": ["Crypto is highly volatile and has little consumer protection.", "Avoid leverage; liquidations hit hardest on fast drops."], "sources": [{"t": "AI retreat stymies bulls (Nov 2 recap)", "d": "us.etrade.com", "u": "https://us.etrade.com/knowledge/library/perspectives/daily-insights/nov2-market-recap"}, {"t": "Why is bitcoin dropping?", "d": "ig.com", "u": "https://www.ig.com/uk/trading-strategies/why-is-bitcoin-dropping-260814"}, {"t": "Bitcoin analysis after the US midterms (headline), via recap", "d": "investinglive.com", "u": "https://investinglive.com/stocks/nasdaq-100-suffers-worst-day-since-2020/"}], "ts": "2026-11-09T06:55:00Z"}, {"id": "friday", "type": "news", "cat": "markets", "tags": ["markets", "ai"], "date": "Fri Nov 6", "headline": "Friday bounce: tech claws back, and AI power stocks surge", "caption": "The Nasdaq rose 1.1% and fear eased, but the S&P 500 still logged its worst week since April 2025. Vistra jumped about 11% and NRG about 10%.", "visual": {"type": "board", "title": "Friday, Nov 6 close", "rows": [{"k": "S&P 500", "v": "7,376.86", "ch": 0.31}, {"k": "Nasdaq", "v": "24,579.42", "ch": 1.09}, {"k": "Dow", "v": "51,285.73", "ch": -0.46}, {"k": "VIX fear gauge", "v": "25.58", "ch": -9.23}, {"k": "Gold", "v": "$4,074", "ch": -0.96}]}, "detail": ["Stocks steadied after Thursday’s rout. AI stocks recovered some losses, while the Dow slipped as a hot jobs report pushed Treasury yields and the dollar higher.", "The standouts were companies that power data centers: Vistra rose about 11% after earnings, NRG Energy about 10% and Quanta Services 6%.", "The VIX, Wall Street’s fear gauge, fell 9% but stayed elevated above 25."], "money": ["Companies that already own valuable infrastructure, like power plants and grid builders, held up better than those that depend on building more.", "A VIX above 20 means bigger daily swings; size positions smaller until it calms d const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pct(n){ const a = Math.abs(n); const s = (a % 1 === 0) ? a.toFixed(0) : a.toFixed(2).replace(/0$/, ''); return (n > 0 ? '+' : n < 0 ? '−' : '') + s + '%'; }

function visualHTML(v, it){
  if(!v || !v.type) v = {type:'points', title: it ? LABELS[it.cat] : '', items: it ? (it.money || []).slice(0,3) : []};
  const title = v.title ? `<div class="vtitle anim">${esc(v.title)}</div>` : '';
  if(v.type === 'stat'){
    let extra = '';
    if(v.rows){
      const max = Math.max(...v.rows.map(r => Math.abs(r[1])));
      extra = `<div class="bars">${v.rows.map(r => {
        const t = r[1] < 0 ? 'loss' : 'gain';
        return `<div class="bar anim"><span class="bl">${esc(r[0])}</span><span class="bt"><span class="bf ${t}" style="--w:${(Math.abs(r[1])/max*100).toFixed(1)}%"></span></span><span class="bv ${t}-c">${pct(r[1])}</span></div>`;}).join('')}</div>`;

    return `${title}<div class="board anim">${v.rows.map(r => {

      const tone = r.tone ? ` ${r.tone}-c` : '';
      return `<div class="brow"><span class="k">${esc(r.k)}${r.s ? `<small>${esc(r.s)}</small>` : ''}</span><span class="v${tone}">${esc(r.v)}</span>${ch}</div>`;}).join('')}</div>${v.foot ? `<div class="vfoot anim">${esc(v.foot)}</div>` : ''}`;
  }
  if(v.type === 'vs'){
    const col = c => `<div class="vcol"><div class="vnum ${c[3]}-c">${esc(c[1])}</div><div class="vbar" style="--h:${Math.round(c[2]*100)}%;background:var(--${c[3] === 'acc' ? 'accent' : c[3]});opacity:${c[3] === 'acc' ? .55 : 1}"></div><div class="vlab">${esc(c[0])}</div></div>`;

  }

    return `${title}<div class="timeline">${v.items.map(t => `<div class="tl anim${t.now ? ' now' : ''}"><div class="d">${esc(t.d)}</div><div class="t">${esc(t.t)}${t.s ? `<small>${esc(t.s)}</small>` : ''}</div></div>`).join('')}</div>`;
  }

    return `${title}<div class="pts">${(v.items || []).map((t, i) => `<div class="pt anim"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(t)}</span></div>`).join('')}</div>`;

  if(z.type === 'flow') return `<div class="flow sv">${z.items.map((t,i) => (i ? '<div class="arrow">↓</div>' : '') + `<div class="fs"><b>${i+1}</b>${esc(t)}</div>`).join('')}</div>`;
  if(z.type === 'dca') return `<div class="dca sv">${z.cols.map(c => `<div class="c"><span class="sh">${c[1]} sh</span><div class="p" style="--h:${c[0]/50*100}%"></div><span class="lab">$${c[0]}</span></div>`).join('')}</div>`;
  if(z.type === 'split') return `<div class="split sv">${z.items.map(s => `<div class="${s[2] || ''}"><small>${esc(s[0])}</small><strong>${esc(s[1])}</strong></div>`).join('')}</div>`;
  return '';
}

function railHTML(it){
  return `<div class="rail">
    <button class="rbtn like" data-act="like" aria-pressed="${liked.has(it.id)}" aria-label="Like">${I.heart}<span>Like</span></button>
    <button class="rbtn" data-act="more" aria-label="Open deep dive">${I.chat}<span>Deep dive</span></button>
    <button class="rbtn save" data-act="save" aria-pressed="${saved.has(it.id)}" aria-label="Save">${I.save}<span>${saved.has(it.id) ? 'Saved' : 'Save'}</span></button>
    <button class="rbtn" data-act="share" aria-label="Copy headline and link">${I.send}<span>Share</span></button>
  </div>`;
}

function capHTML(it){
  const c = it.cat;
  const btn = it.type === 'news'
    ? `<button class="morebtn" data-act="more"><span class="coin">$</span>How this can make you money</button>`
    : `<button class="morebtn" data-act="more"><span class="coin">$</span>Read the full script</button>`;
  return `<div class="cap">
    <div class="who"><div class="av">${LABELS[c][0]}</div><span class="handle">@${HANDLES[c]}</span><span class="when">· ${esc(rel(it.ts) || it.date)}</span>${isNew(it) ? '<span class="newpill">NEW</span>' : ''}</div>
    <div class="headline">${esc(it.headline)}</div>
    <div class="caption">${esc(it.caption)}</div>
    ${btn}
  </div>`;
}

function reelHTML(it, idx){
  const hue = HUES[it.cat];
  const ghost = `<div class="ghost" aria-hidden="true">${LABELS[it.cat].toUpperCase()}</div>`;
  if(it.type === 'edu'){
    return `<section class="reel edu" data-id="${it.id}" data-idx="${idx}" style="--hue:${hue}" aria-label="${esc(it.headline)}">
      <div class="bg"></div>${ghost}
      <div class="segs">${it.scenes.map(() => '<div class="seg"><i></i></div>').join('')}</div>
      <div class="ctrl"><button class="cbtn" data-act="voice" aria-pressed="${voiceOn}">${voiceOn ? I.vol : I.mute}<span>${voiceOn ? 'Voice on' : 'Voice off'}</span></button></div>
      <div class="spacer"></div>
      <div class="stage"><div class="scenes">${it.scenes.map((s,i) => `<div class="scene${i === 0 ? ' on' : ''}">
          <div class="sk">${esc(s.k)}</div><div class="st2">${esc(s.t)}</div>${s.s ? `<div class="ss">${esc(s.s)}</div>` : ''}${sceneViz(s.viz)}</div>`).join('')}</div></div>
      <div class="pausemark">${I.play}</div>
      ${capHTML(it)}${railHTML(it)}
    </section>`;
  }
  return `<section class="reel" data-id="${it.id}" data-idx="${idx}" style="--hue:${hue}" aria-label="${esc(it.headline)}">
    <div class="bg"></div>${ghost}
    <div class="spacer"></div>
    <div class="stage">${visualHTML(it.visual, it)}</div>
    ${capHTML(it)}${railHTML(it)}
    ${idx === 0 ? `<div class="hint" id="hint">${I.chev} Swipe up</div>` : ''}
  </section>`;
}

const feed = document.getElementById('feed');
let list = [];
function isNew(it){ return lastSeen && (Date.parse(it.ts) || 0) > lastSeen; }
function caughtUpHTML(n){
  return `<section class="reel endcard divider" data-idx="-1" style="--hue:#3DDC97">
    <div class="bg"></div><div class="spacer"></div>
    <div class="stage"><div class="check" aria-hidden="true">✓</div><h2>You’re caught up.</h2>
    <p>You’ve seen the ${n} new post${n === 1 ? '' : 's'} since your last visit. Everything below is older.</p>
    <div class="row"><button class="pbtn" data-act="close">Done for now</button></div>
    <p class="small">New posts arrive about every hour.</p></div></section>`;
}
function render(){
  stopPlayer();
  active = null;
  list = ITEMS.filter(it => filter === 'all' ? true : filter === 'saved' ? saved.has(it.id) : it.tags.includes(filter));
  const newCount = list.filter(isNew).length;
  let html = '';
  list.forEach((it, i) => {
    html += reelHTML(it, i);
    if(newCount && i === newCount - 1 && newCount < list.length) html += caughtUpHTML(newCount);
  });
  const end = `<section class="reel endcard" data-idx="${list.length}" style="--hue:#FFB547">
    <div class="bg"></div><div class="spacer"></div>
    <div class="stage">
      ${list.length ? `<h2>That’s everything.</h2><p>You’ve reached the end of the feed. New posts land about every hour, so put the phone down and come back later.</p>`
        : (filter === 'saved' ? `<h2>Nothing saved yet.</h2><p class="empty">Tap Save on any post and it will show up here.</p>` : `<h2>No posts here yet.</h2><p class="empty">This topic will fill in as new posts arrive.</p>`)}
      <div class="row"><button class="pbtn" data-act="top">Back to the top</button>${filter !== 'all' ? '<button class="gbtn" data-act="all">See everything</button>' : ''}</div>
      <p class="small">${UPDATED ? 'Feed updated ' + esc(rel(UPDATED)) + '. ' : ''}Sources are listed in each deep dive. Not financial advice.</p>
    </div></section>`;
  feed.innerHTML = html + end;
  feed.scrollTop = 0;
  observe();
}
function markSeen(){
  const newest = ITEMS.reduce((m, it) => Math.max(m, Date.parse(it.ts) || 0), 0);
  if(newest) store.set('lastSeen', newest);
}

/* ======================= CHIPS ======================= */
const chips = document.getElementById('chips');
chips.innerHTML = FILTERS.map(f => `<button class="chip" data-f="${f.id}" aria-pressed="${f.id === filter}">${f.label}</button>`).join('');
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f;
  chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});

/* ======================= ACTIVE REEL ======================= */
let io;
function observe(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if(en.isIntersecting && en.intersectionRatio >= .6) setActive(en.target); });
  }, {root:feed, threshold:[.6]});
  feed.querySelectorAll('.reel').forEach(r => io.observe(r));
}
const countEl = document.getElementById('count');
function setActive(sec){
  if(active === sec) return;
  if(active) active.classList.remove('live');
  stopPlayer();
  active = sec;
  void sec.offsetWidth;
  sec.classList.add('live');
  const idx = +sec.dataset.idx;
  countEl.textContent = (idx >= 0 && idx < list.length) ? `${idx + 1} / ${list.length}` : '';
  if(idx > 0){ const h = document.getElementById('hint'); if(h) h.classList.add('gone'); }
  const it = byId[sec.dataset.id];
  if(it && it.type === 'edu') player = new Player(sec, it);
}

/* ======================= EXPLAINER PLAYER ======================= */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
try{ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
function pickVoice(){
  const en = voices.filter(v => /^en(-|_)US/i.test(v.lang));
  return en.find(v => /Samantha|Ava|Allison|Google US English|Natural/i.test(v.name)) || en[0] || voices[0] || null;
}
function speak(text, onend){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v) u.voice = v;
    u.rate = 1.04; u.pitch = 1;
    u.onend = onend; u.onerror = onend;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }

class Player{
  constructor(sec, it){
    this.sec = sec; this.it = it; this.i = 0; this.paused = false; this.timer = null; this.token = 0;
    this.scenes = [...sec.querySelectorAll('.scene')];
    this.segs = [...sec.querySelectorAll('.seg i')];
    sec.classList.remove('paused');
    this.show(0);
  }
  text(s){ return s.say || [s.t, s.s].filter(Boolean).join(' '); }
  dur(s){ const w = this.text(s).split(/\s+/).length; return Math.max(3200, w * 330 + 1500); }
  show(i){
    this.i = i; const tok = ++this.token;
    this.scenes.forEach((el, j) => el.classList.toggle('on', j === i));
    this.segs.forEach((el, j) => { el.style.transition = 'none'; el.style.width = j < i ? '100%' : '0%'; });
    const s = this.it.scenes[i];
    const d = this.dur(s);
    void this.sec.offsetWidth;
    const bar = this.segs[i];
    bar.style.transition = `width ${d}ms linear`; bar.style.width = '100%';
    clearTimeout(this.timer);
    if(voiceOn){
      let done = false;
      const next = () => { if(done || tok !== this.token || this.paused) return; done = true; this.timer = setTimeout(() => this.next(), 450); };
      speak(this.text(s), next);
      this.timer = setTimeout(next, d * 2.6);
    } else {
      this.timer = setTimeout(() => { if(tok === this.token && !this.paused) this.next(); }, d);
    }
  }
  next(){ this.show((this.i + 1) % this.scenes.length); }
  toggle(){
    if(this.paused){ this.paused = false; this.sec.classList.remove('paused'); this.show(this.i); }
    else { this.paused = true; this.token++; clearTimeout(this.timer); stopSpeech();
      const bar = this.segs[this.i]; const w = getComputedStyle(bar).width; bar.style.transition = 'none'; bar.style.width = w;
      this.sec.classList.add('paused'); }
  }
  restart(){ if(!this.paused) this.show(this.i); }
  stop(){ this.token++; clearTimeout(this.timer); stopSpeech(); }
}
function stopPlayer(){ if(player){ player.stop(); player = null; } }

/* ======================= INTERACTIONS ======================= */
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1600); }

function setLike(id, on, sec){
  on ? liked.add(id) : liked.delete(id); store.set('liked', [...liked]);
  const b = sec.querySelector('[data-act="like"]'); if(b) b.setAttribute('aria-pressed', on);
}
function burst(sec, x, y){
  const r = sec.getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'burst';
  el.style.left = (x - r.left) + 'px'; el.style.top = (y - r.top) + 'px';
  el.innerHTML = I.heart; sec.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

async function share(it){
  const src = it.sources && it.sources[0] ? `\n${it.sources[0].u}` : '';
  const text = `${it.headline}${src}`;
  try{ await navigator.clipboard.writeText(text); toast('Headline and link copied'); }
  catch(e){ toast('Copy isn’t available here'); }
}

let lastTap = {t:0, sec:null}, tapTimer = null;
feed.addEventListener('click', e => {
  const sec = e.target.closest('.reel'); if(!sec) return;
  const actEl = e.target.closest('[data-act]');
  const it = byId[sec.dataset.id];
  if(actEl){
    const act = actEl.dataset.act;
    if(act === 'top'){ feed.scrollTo({top:0, behavior:'smooth'}); return; }
    if(act === 'all'){ chips.querySelector('[data-f="all"]').click(); return; }
    if(act === 'close'){ toast('See you next hour'); return; }
    if(!it) return;
    if(act === 'like'){ const on = !liked.has(it.id); setLike(it.id, on, sec); if(on){ const r = actEl.getBoundingClientRect(); burst(sec, r.left + r.width/2 - 40, r.top - 30); } }
    if(act === 'save'){ const on = !saved.has(it.id); on ? saved.add(it.id) : saved.delete(it.id); store.set('saved', [...saved]);
      actEl.setAttribute('aria-pressed', on); actEl.querySelector('span').textContent = on ? 'Saved' : 'Save'; toast(on ? 'Saved to this device' : 'Removed from saved'); }
    if(act === 'share') share(it);
    if(act === 'more') openSheet(it);
    if(act === 'voice'){
      voiceOn = !voiceOn; store.set('voice', voiceOn);
      feed.querySelectorAll('[data-act="voice"]').forEach(b => { b.setAttribute('aria-pressed', voiceOn); b.innerHTML = (voiceOn ? I.vol : I.mute) + `<span>${voiceOn ? 'Voice on' : 'Voice off'}</span>`; });
      if(!voiceOn) stopSpeech();
      if(player && player.sec === sec) player.restart();
      if(voiceOn && !('speechSynthesis' in window)) toast('Voice isn’t supported in this browser');
    }
    return;
  }
  if(e.target.closest('a, .sheet')) return;
  if(!it) return;
  const now = Date.now();
  if(lastTap.sec === sec && now - lastTap.t < 300){
    clearTimeout(tapTimer); lastTap = {t:0, sec:null};
    if(!liked.has(it.id)) setLike(it.id, true, sec);
    burst(sec, e.clientX, e.clientY);
    return;
  }
  lastTap = {t:now, sec};
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { if(it.type === 'edu' && player && player.sec === sec) player.toggle(); }, 300);
});

/* keyboard: arrows / j k to move, space to pause */
document.addEventListener('keydown', e => {
  if(sheet.classList.contains('on')){ if(e.key === 'Escape') closeSheet(); return; }
  if(e.target.closest && e.target.closest('input,textarea')) return;
  const h = feed.clientHeight;
  if(['ArrowDown','j','PageDown'].includes(e.key)){ e.preventDefault(); feed.scrollBy({top:h, behavior:'smooth'}); }
  if(['ArrowUp','k','PageUp'].includes(e.key)){ e.preventDefault(); feed.scrollBy({top:-h, behavior:'smooth'}); }
  if(e.key === ' ' && player){ e.preventDefault(); player.toggle(); }
});

/* ======================= DEEP-DIVE SHEET ======================= */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'), shBody = document.getElementById('shBody'), shTitle = document.getElementById('shTitle');
let resumeAfter = false;
function openSheet(it){
  if(it.type === 'edu'){
    shTitle.textContent = 'Full script';
    shBody.innerHTML = `<h2>${esc(it.headline)}</h2><div class="meta">${LABELS[it.cat]} · ${it.scenes.length} scenes</div>` +
      it.scenes.map((s, i) => `<p><b style="font-family:var(--mono);color:var(--accent);font-size:12px">${String(i+1).padStart(2,'0')}</b>&nbsp; <b>${esc(s.t)}</b> ${s.s ? esc(s.s) : ''}</p>`).join('') +
      `<p class="disc">Educational content, not financial advice. Numbers referenced come from this week’s news reels.</p>`;
  } else {
    shTitle.textContent = 'Deep dive';
    shBody.innerHTML = `<h2>${esc(it.headline)}</h2><div class="meta">@${HANDLES[it.cat]} · ${esc(it.date)}${it.ts ? ' · posted ' + esc(rel(it.ts)) : ''}</div>
      ${it.detail.map(p => `<p>${esc(p)}</p>`).join('')}
      <div class="box"><h3>How this can make you money</h3><ul>${it.money.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>
      ${it.risk ? `<div class="box risk"><h3>Watch out</h3><ul>${it.risk.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : ''}
      <div class="srcs"><h3>Sources</h3>${it.sources.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}<span>${esc(s.d)}</span></a>`).join('')}</div>
      <p class="disc">General information, not personalized financial advice. Figures are from reports published Nov 2–8, 2026 and may since have changed.</p>`;
  }
  shBody.scrollTop = 0;
  resumeAfter = !!(player && !player.paused);
  if(resumeAfter) player.toggle();
  sheet.classList.add('on'); scrim.classList.add('on');
  document.getElementById('shClose').focus({preventScroll:true});
}
function closeSheet(){
  sheet.classList.remove('on'); scrim.classList.remove('on');
  if(resumeAfter && player && player.paused) player.toggle();
  resumeAfter = false;
}
document.getElementById('shClose').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
/* swipe the sheet down to close */
(() => { let y0 = null;
  sheet.addEventListener('touchstart', e => { if(shBody.scrollTop <= 0) y0 = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchmove', e => { if(y0 === null) return; const dy = e.touches[0].clientY - y0; if(dy > 0){ sheet.style.transition = 'none'; sheet.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  sheet.addEventListener('touchend', e => { if(y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sheet.style.transition = ''; sheet.style.transform = ''; y0 = null; if(dy > 90) closeSheet(); });
})();

document.addEventListener('visibilitychange', () => { if(document.hidden && player && !player.paused) player.toggle(); });

/* ======================= BOOT + NEW-POST CHECK ======================= */
const freshBtn = document.getElementById('fresh');
const issueEl = document.getElementById('issue');
let pending = null;
function apply(d){
  ITEMS = clean(d.items || []);
  UPDATED = d.updated || (ITEMS[0] && ITEMS[0].ts) || null;
  byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
  issueEl.textContent = UPDATED ? 'Updated ' + rel(UPDATED) : '';
}
const newestOf = arr => arr.reduce((m, i) => Math.max(m, Date.parse(i.ts) || 0), 0);
async function boot(){
  apply(seedData());
  render();
  const d = await fetchPosts();
  if(d && newestOf(d.items) > newestOf(ITEMS)){ apply(d); render(); }
  setTimeout(markSeen, 4000);
}
async function checkNew(){
  const d = await fetchPosts();
  if(!d) return;
  const mine = newestOf(ITEMS);
  if(newestOf(d.items) > mine){
    pending = d;
    const n = d.items.filter(i => (Date.parse(i.ts) || 0) > mine).length;
    freshBtn.textContent = `↑ ${n} new post${n === 1 ? '' : 's'}`;
    freshBtn.classList.add('on');
  }
}
freshBtn.addEventListener('click', () => {
  if(!pending) return;
  lastSeen = newestOf(ITEMS);
  apply(pending); pending = null; freshBtn.classList.remove('on');
  filter = 'all'; chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === 'all'));
  render(); setTimeout(markSeen, 4000);
});
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkNew(); });
setInterval(() => { if(!document.hidden) checkNew(); }, 10 * 60 * 1000);
boot();
</script>
